name = "canopy"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain: serve the whole app at memo-sphere.com. Cloudflare provisions the
# DNS record + SSL cert automatically (the zone is in this account). The Worker also
# stays reachable at its workers.dev URL.
routes = [
  { pattern = "memo-sphere.com", custom_domain = true }
]
# Keep the workers.dev URL alive alongside the custom domain (fallback during the
# custom-domain SSL provisioning, and for testing).
workers_dev = true

# Static Assets: served before the Worker fetch handler. Matched files (e.g. "/")
# are returned directly; unmatched paths (/ingest, /feed, /mcp) fall through to src/index.ts.
[assets]
directory = "./web/dist"
binding = "ASSETS"

# WRONG-ACCOUNT GUARD (the 2026-07-17 outage: `db:migrate:remote` silently no-oped
# against a different Cloudflare account while Workers Builds deployed the code, and
# sign-in 500'd for ~10 days). Pin the account that owns the prod D1 below so any
# wrangler command from a workstation logged into another account FAILS LOUDLY
# instead of targeting the wrong place. To fill it in: `npx wrangler login` into the
# account whose `npx wrangler d1 list` shows database 53c1314d-…, then `npx wrangler
# whoami` and paste the Account ID here. (Left commented until verified — this
# machine's current login cannot see the prod D1, which is itself the failure mode.)
# account_id = "<prod account id — see above>"

# D1: the PROD database id (Miniflare uses a local sqlite for dev and tests, ignoring
# this id). The in-Worker selfcheck (src/auth/selfcheck.ts, D1_MIGRATIONS) compares
# d1_migrations against the compiled-in migration count every 6h, so a deploy whose
# remote migrations were not applied alerts through the error-level log channel.
[[d1_databases]]
binding = "DB"
database_name = "canopy"
database_id = "53c1314d-2cb3-46b6-9d99-293a855524a4"

[vars]
# "owner/repo" the roadmap/progress read from. Set to your repo.
GITHUB_REPO = "Jose-Gael-Cruz-Lopez/tesseract"
# GitHub org whose ACTIVE members may log in. Leave empty for a personal repo —
# then ADMIN_LOGINS gates login instead of org membership.
AUTH_ORG = ""
# Comma-separated GitHub logins allowed in (login gate when AUTH_ORG is empty)
# and for admin actions. Set to your GitHub login to start.
ADMIN_LOGINS = "Jose-Gael-Cruz-Lopez"
# The GitHub App's URL slug — the "Connect repos" button links to
# github.com/apps/<slug>/installations/new (Phase 3). Not a secret.
GITHUB_APP_SLUG = "memo-sphere"
# Soft-rollout signup gate (issue #21): comma-separated GitHub logins allowed to
# complete sign-in at /auth/callback. Empty ⇒ open signup (any GitHub user).
LOGIN_ALLOWLIST = ""

[observability]
enabled = true

# Capture-time PR/issue summaries come from Google Gemini over REST (GEMINI_API_KEY
# secret) — a plain fetch(), not a Cloudflare binding, so no [ai] block is needed.

# Scheduled backstop for the milestone progress cache (event-derived writes are primary).
[triggers]
crons = ["0 */6 * * *"]
